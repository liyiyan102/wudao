<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>舞岛 PGC 后台</title>
<style>
  :root{
    --ink:#1a1a1a; --ink2:#3d3d3d; --muted:#8a8a8e; --muted2:#b0b0b4;
    --line:#e5e7eb; --line2:#f3f4f6; --bg:#f9fafb; --card:#ffffff;
    --purple:#534ab7; --purple-d:#3c3489; --purple-bg:#eeedfe; --purple-bg2:#f5f4fd;
    --red:#fa5151; --green:#07c160; --amber:#f5a623; --orange:#ff6b35;
    --sidebar-w:220px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","SF Pro Text",sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;font-size:14px;}
  button{font-family:inherit;}

  /* 登录层 */
  #login-mask{position:fixed;inset:0;background:rgba(26,26,26,.45);z-index:999;display:flex;align-items:center;justify-content:center;}
  .login-card{width:360px;background:var(--card);border-radius:12px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.2);}
  .login-card h2{font-size:18px;margin-bottom:4px;}
  .login-card .sub{font-size:13px;color:var(--muted);margin-bottom:20px;}
  .login-card input{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font-size:14px;margin-bottom:12px;}
  .login-card input:focus{outline:none;border-color:var(--purple);}
  .login-card .err{color:var(--red);font-size:12px;margin-bottom:10px;min-height:16px;}
  .login-btn{width:100%;height:40px;background:var(--purple);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
  .login-btn:hover{background:var(--purple-d);}

  .topbar{height:56px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:100;}
  .topbar .logo{font-size:16px;font-weight:700;color:var(--purple-d);display:flex;align-items:center;gap:8px;}
  .topbar .logo .dot{width:24px;height:24px;border-radius:6px;background:var(--purple);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;}
  .topbar .crumb{margin-left:32px;font-size:13px;color:var(--muted);}
  .topbar .crumb b{color:var(--ink);}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:16px;font-size:13px;color:var(--muted);}
  .topbar .ava{width:28px;height:28px;border-radius:50%;background:var(--purple);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .topbar .logout{cursor:pointer;color:var(--muted);font-size:12px;border:none;background:none;}
  .topbar .logout:hover{color:var(--red);}

  .layout{display:flex;min-height:calc(100vh - 56px);}
  .sidebar{width:var(--sidebar-w);background:var(--card);border-right:1px solid var(--line);padding:16px 0;flex-shrink:0;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;}
  .sidebar .group{margin-bottom:20px;}
  .sidebar .group-h{font-size:11px;font-weight:600;color:var(--muted2);letter-spacing:1px;text-transform:uppercase;padding:0 20px 8px;}
  .sidebar .item{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:14px;color:var(--ink2);cursor:pointer;border-left:3px solid transparent;}
  .sidebar .item:hover{background:var(--bg);}
  .sidebar .item.on{background:var(--purple-bg);color:var(--purple-d);font-weight:600;border-left-color:var(--purple);}
  .sidebar .item .ic{width:18px;height:18px;fill:currentColor;flex-shrink:0;}

  .main{flex:1;padding:24px 32px;max-width:calc(100vw - var(--sidebar-w));overflow-x:hidden;}
  .page-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .page-h h1{font-size:20px;font-weight:700;}
  .page-h .actions{display:flex;gap:8px;}
  .btn{height:36px;padding:0 16px;border-radius:6px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:none;}
  .btn-pri{background:var(--purple);color:#fff;}
  .btn-pri:hover{background:var(--purple-d);}
  .btn-ghost{background:var(--card);color:var(--ink2);border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--bg);}
  .btn-danger{background:#fff;color:var(--red);border:1px solid var(--red);}
  .btn .ic{width:16px;height:16px;fill:currentColor;}

  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;}
  .stat-card .label{font-size:12px;color:var(--muted);margin-bottom:8px;}
  .stat-card .val{font-size:28px;font-weight:700;letter-spacing:-0.5px;}
  .stat-card .delta{font-size:12px;margin-top:6px;color:var(--muted);}

  .table-card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:24px;}
  .table-card .tc-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .table-card .tc-h h2{font-size:15px;font-weight:600;}
  .tc-filters{display:flex;gap:8px;flex-wrap:wrap;}
  .filter-input{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:6px;font-size:13px;width:180px;}
  .filter-select{height:32px;padding:0 28px 0 12px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:var(--card);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{background:var(--bg);text-align:left;padding:10px 16px;font-weight:600;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);}
  td{padding:12px 16px;border-bottom:1px solid var(--line2);vertical-align:middle;}
  tr:hover td{background:#fafbfc;}
  tr.drag-row{cursor:grab}
  tr.drag-row.dragging{opacity:.45}
  tr.drag-row.drag-over td{box-shadow:inset 0 2px 0 var(--purple)}
  .drag-handle{color:var(--muted2);font-size:14px;letter-spacing:-1px;user-select:none;padding-right:6px;cursor:grab}
  .sort-tip{font-size:12px;color:var(--muted);padding:0 20px 12px}
  .chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:3px;font-weight:600;white-space:nowrap;}
  .chip-purple{background:var(--purple-bg);color:var(--purple-d);}
  .chip-green{background:#E8F5E9;color:#2E7D32;}
  .chip-amber{background:#FFF3E0;color:#E65100;}
  .chip-blue{background:#E3F2FD;color:#1565C0;}
  .chip-red{background:#FFE7E0;color:#C62828;}
  .chip-gray{background:var(--line2);color:var(--muted);}
  .chip-cyan{background:#E0F7FA;color:#00838F;}
  .row-actions{display:flex;gap:10px;}
  .row-actions a{font-size:12px;color:var(--purple);cursor:pointer;}
  .row-actions a:hover{text-decoration:underline;}
  .row-actions a.del{color:var(--red);}
  .status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;}
  .status-dot.published{background:var(--green);}
  .status-dot.draft{background:var(--muted2);}
  .status-dot.offline{background:var(--red);}
  /* 多选复选框 */
  .cb{width:20px;height:20px;border:2px solid var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--card);transition:all .15s;}
  .cb:hover{border-color:var(--purple);}
  .cb.checked{background:var(--purple);border-color:var(--purple);}

  /* 编辑器 */
  .editor-layout{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start;}
  .editor-main{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px;min-width:0;}
  .editor-side{position:sticky;top:80px;display:grid;gap:16px;}
  .editor-toolbar{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line);margin:-24px -24px 20px;background:var(--bg);border-radius:8px 8px 0 0;flex-wrap:wrap;}
  .tb-btn{height:32px;min-width:32px;padding:0 8px;border:none;background:transparent;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:12px;font-weight:600;gap:4px;white-space:nowrap;}
  .tb-btn:hover{background:var(--card);color:var(--purple);}
  .tb-btn.callout{color:var(--purple);}
  .tb-btn.blockquote{color:var(--muted);}
  .tb-btn.tb-list{height:32px;padding:0 10px;border:1px solid var(--line);background:#fff;color:var(--ink);}
  .tb-btn.tb-list:hover{border-color:var(--purple);background:var(--purple-bg);color:var(--purple-d);}
  .tb-btn .ic-sm{width:14px;height:14px;fill:currentColor;flex-shrink:0;}
  .tb-sep{width:1px;background:var(--line);margin:4px 4px;}

  .field{margin-bottom:18px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;}
  .field input[type=text],.field input[type=url],.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:14px;font-family:inherit;color:var(--ink);background:var(--card);}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(83,74,183,.1);}
  .field-title input{font-size:20px;font-weight:700;border:none;padding:0 0 8px;border-bottom:1px solid var(--line);border-radius:0;}
  .field-title input:focus{border-bottom-color:var(--purple);box-shadow:none;}
  .field-subtitle input{font-size:13px;color:var(--muted);border:none;padding:0;}
  .field-subtitle input:focus{box-shadow:none;}

  /* 双栏：编辑 + 实时预览 */
  .split{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .split textarea{min-height:420px;line-height:1.8;font-size:13.5px;font-family:"SF Mono",Menlo,Consolas,monospace;resize:vertical;}
  .preview-pane{border:1px solid var(--line);border-radius:6px;padding:16px 20px;min-height:420px;overflow-y:auto;background:var(--card);font-size:15px;line-height:1.85;color:var(--ink2);max-height:640px;}
  .pv-h3{font-size:19px;font-weight:700;color:var(--ink);margin:32px 0 14px;}
  .pv-h4{font-size:16px;font-weight:700;color:var(--ink);margin:24px 0 10px;}
  .pv-p{margin-bottom:16px;white-space:pre-wrap;}
  .pv-list{margin:4px 0 16px;padding-left:0;list-style:none;}
  .pv-list li{display:flex;gap:8px;margin:0 0 6px;line-height:1.7;}
  .pv-list .mk{flex-shrink:0;min-width:18px;font-weight:600;color:var(--ink);}
  .pv-list .tx{flex:1;min-width:0;}
  .pv-callout{background:var(--purple-bg);border-left:4px solid var(--purple);padding:16px 18px;margin:0 0 24px;border-radius:0 8px 8px 0;position:relative;}
  .pv-callout .co-title{font-size:12px;font-weight:700;color:var(--purple-d);letter-spacing:.5px;margin-bottom:6px;text-transform:uppercase;}
  .pv-callout .co-body{font-size:14px;line-height:1.75;color:var(--ink2);white-space:pre-wrap;}
  .pv-quote{border-left:3px solid #D1D5DB;padding:4px 0 4px 16px;margin:18px 0;font-size:14.5px;color:#4a4a5a;line-height:1.8;font-style:italic;}
  .pv-quote .cite{display:block;font-size:12px;color:var(--muted2);font-style:normal;margin-top:10px;padding-top:8px;border-top:.5px solid #E5E7EB;}
  .pv-quote .cite::before{content:"— ";color:var(--muted2);}
  .pv-img{height:180px;border-radius:8px;background:var(--purple-bg2);display:flex;align-items:center;justify-content:center;color:var(--muted2);font-size:12px;margin:16px 0;border:1px dashed var(--line);}
  .pv-img-real{width:100%;border-radius:8px;margin:16px 0;display:block;cursor:pointer;}
  .pv-video{width:100%;border-radius:8px;margin:16px 0;display:block;background:#000;}
  .preview-pane [data-start]{cursor:pointer;position:relative;}
  .preview-pane [data-start]:hover{background:rgba(83,74,183,.04);}

  .side-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;}
  .side-card h3{font-size:13px;font-weight:700;margin-bottom:12px;}
  .side-card .field{margin-bottom:14px;}
  .side-card .field:last-child{margin-bottom:0;}

  .tag-box{display:flex;flex-wrap:wrap;gap:6px;border:1px solid var(--line);border-radius:6px;padding:6px;min-height:38px;}
  .tag-box .tag{display:inline-flex;align-items:center;gap:4px;background:var(--purple-bg);color:var(--purple-d);font-size:12px;padding:3px 8px;border-radius:3px;font-weight:600;}
  .tag-box .tag .x{cursor:pointer;font-size:14px;}
  .tag-box input{border:none;outline:none;flex:1;font-size:13px;min-width:60px;}
  .ms-box{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0;}
  .ms-chip{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font-size:12px;font-weight:500;cursor:pointer;user-select:none;}
  .ms-chip:hover{border-color:var(--purple);}
  .ms-chip.on{background:var(--purple-bg);border-color:var(--purple);color:var(--purple-d);font-weight:600;}
  .field select.filter-select,.field select{width:100%;height:40px;border:1px solid var(--line);border-radius:6px;padding:0 12px;font-size:14px;background:var(--card);color:var(--ink);font-family:inherit;}
  .field select:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(83,74,183,.1);}

  .switch-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0;}
  .switch-row .lbl{font-size:13px;color:var(--ink2);}
  .switch{position:relative;width:40px;height:22px;background:var(--line);border-radius:11px;cursor:pointer;transition:background .2s;flex-shrink:0;}
  .switch.on{background:var(--purple);}
  .switch .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
  .switch.on .knob{left:20px;}

  .tip{background:var(--purple-bg);border:1px solid var(--purple);border-radius:6px;padding:10px 14px;font-size:12px;color:var(--purple-d);line-height:1.6;margin-bottom:16px;}

  /* 活动编辑 */
  .activity-hero-preview{height:140px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700;text-align:center;padding:0 24px;margin-bottom:16px;position:relative;background:linear-gradient(135deg,#534ab7 0%,#3c3489 100%);}
  .activity-hero-preview .badge{position:absolute;top:10px;left:10px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:3px;background:rgba(255,255,255,.95);color:var(--purple);}
  .schedule-editor{border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .se-row{display:grid;grid-template-columns:120px 1fr 32px;border-bottom:1px solid var(--line2);}
  .se-row:last-child{border-bottom:none;}
  .se-row input{border:none;padding:8px 10px;font-size:13px;font-family:inherit;width:100%;box-sizing:border-box;}
  .se-row input[type="time"]{min-width:0;}
  .dt-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .dt-pair .field{margin-bottom:0;}
  input[type="date"],input[type="time"]{font-family:inherit;font-size:13px;}
  .se-row .se-del{border:none;background:transparent;color:var(--muted);cursor:pointer;}
  .se-row .se-del:hover{color:var(--red);}
  .se-add{padding:8px 10px;font-size:13px;color:var(--purple);cursor:pointer;background:var(--bg);font-weight:600;border:none;width:100%;text-align:left;}

  .modal-mask{position:fixed;inset:0;background:rgba(26,26,26,.45);z-index:200;display:flex;align-items:center;justify-content:center;}
  .modal{width:420px;background:var(--card);border-radius:12px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.2);}
  .modal h3{font-size:15px;margin-bottom:16px;}
  .modal .m-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}

  .toast{position:fixed;top:70px;right:24px;z-index:300;background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;}

  @media (max-width:1100px){
    .editor-layout{grid-template-columns:1fr;}
    .split{grid-template-columns:1fr;}
    .stats-grid{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>

<!-- 登录层 -->
<div id="login-mask" style="display:none">
  <div class="login-card">
    <h2>舞岛 PGC 后台</h2>
    <div class="sub">运营内容与活动管理</div>
    <input type="password" id="login-pass" placeholder="管理口令" autofocus>
    <div class="err" id="login-err"></div>
    <button class="login-btn" onclick="doLogin()">登 录</button>
  </div>
</div>

<div id="app" style="display:none">
  <div class="topbar">
    <div class="logo"><div class="dot">舞</div>舞岛后台</div>
    <div class="crumb" id="crumb">内容管理 / <b>内容列表</b></div>
    <div class="right">
      <span>管理员</span>
      <div class="ava">舞</div>
      <button class="logout" onclick="doLogout()">退出</button>
    </div>
  </div>

  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main" id="main"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ md.js 浏览器垫片（与小程序渲染引擎同源 v0.3：图片/视频/位置区间） ============ */
const PARSE_MD = (function(){
  const IMG_RE = /^!\[([^\]]*)\]\(([^)]+)\)$/
  const VIDEO_RE = /^@\[([^\]]*)\]\(([^)]+)\)$/
  const UL_RE = /^[-*•]\s+(.+)$/
  const OL_RE = /^(\d+)[.)、]\s*(.+)$/
  function matchList(line){
    let m = line.match(UL_RE)
    if (m) return { kind:'ul', text:m[1], n:0 }
    m = line.match(OL_RE)
    if (m) return { kind:'ol', text:m[2], n:Number(m[1]) }
    return null
  }
function parseTableLine(line) {
  let s = line.trim()
  if (s.startsWith('|')) s = s.slice(1)
  if (s.endsWith('|')) s = s.slice(0, -1)
  return s.split('|').map(c => c.trim())
}
function isDelimiterRow(cells) {
  return cells.length > 0 && cells.every(c => /^:?-+:?$/.test(c))
}
function parseAligns(cells) {
  return cells.map(c => {
    const left = c.startsWith(':')
    const right = c.endsWith(':')
    if (left && right) return 'center'
    if (right) return 'right'
    if (left) return 'left'
    return 'left'
  })
}
function isTableLine(line) {
  const t = line.trim()
  return t.length >= 3 && t.startsWith('|') && t.endsWith('|')
}
function parseMarkdown(body){
  const src = String(body||'')
  const lines = src.split('\n'); const blocks = [];
  let callout = null, quote = null, list = null, table = null, pos = 0;
  const flushCallout = () => { if (callout){ blocks.push({type:'callout',title:callout.title||'',text:callout.text.join('\n'),_start:callout._start,_end:pos}); callout=null; } };
  const flushQuote = () => { if (quote){ blocks.push({type:'quote',text:quote.text.join('\n'),cite:quote.cite||'',_start:quote._start,_end:pos}); quote=null; } };
  const flushList = () => { if (list){ blocks.push({type:list.kind,items:list.items,_start:list._start,_end:pos}); list=null; } };
  const flushTable = () => { if (table){ blocks.push({type:'table',headers:table.headers,aligns:table.aligns,rows:table.rows,_start:table._start,_end:pos}); table=null; } };
  const flushAll = () => { flushCallout(); flushQuote(); flushList(); flushTable(); };
  for (const raw of lines){
    const line = raw.trim(); const lineLen = raw.length;
    if (!line){ flushAll(); pos += lineLen+1; continue; }
    const li = matchList(line)
    if (isTableLine(line)){
      flushCallout(); flushQuote(); flushList();
      const cells = parseTableLine(line)
      if (!table){
        table = { headers: cells.map(c => ({ text: c })), aligns: cells.map(() => 'left'), rows: [], _start: pos }
      } else if (isDelimiterRow(cells)){
        table.aligns = parseAligns(cells)
      } else {
        table.rows.push(cells.map(c => ({ text: c })))
      }
    }
    else if (li){
      flushAll();
      if (!list) list = { kind: li.kind, items: [], _start: pos };
      list.items.push({ text: li.text, n: li.n });
    }
      else if (line.indexOf('### ')===0){ flushAll(); blocks.push({type:'h4',text:line.slice(4),_start:pos,_end:pos+lineLen}); }
      else if (line.indexOf('## ')===0){ flushAll(); blocks.push({type:'h3',text:line.slice(3),_start:pos,_end:pos+lineLen}); }
      else if (line.indexOf('>>t ')===0){ flushList(); if(!callout) callout={title:'',text:[],_start:pos}; callout.title=line.slice(4); }
      else if (line.indexOf('>> ')===0){ flushList(); if(!callout) callout={title:'',text:[],_start:pos}; callout.text.push(line.slice(3)); }
      else if (line.indexOf('> ')===0){
        flushList();
        const t = line.slice(2);
        if (t.indexOf('——')===0 || t.indexOf('--')===0){
          const cite = t.replace(/^——\s*/,'');
          if (quote) quote.cite = cite;
          else blocks.push({type:'quote',text:'',cite,_start:pos,_end:pos+lineLen});
        } else { flushCallout(); if(!quote) quote={text:[],cite:'',_start:pos}; quote.text.push(t); }
      }
      else if (IMG_RE.test(line)){ flushAll(); const m=line.match(IMG_RE); blocks.push({type:'img',text:m[1]||'图片',url:m[2],_start:pos,_end:pos+lineLen}); }
      else if (VIDEO_RE.test(line)){ flushAll(); const m=line.match(VIDEO_RE); blocks.push({type:'video',text:m[1]||'视频',url:m[2],_start:pos,_end:pos+lineLen}); }
      else { flushAll(); blocks.push({type:'p',text:line,_start:pos,_end:pos+lineLen}); }
      pos += lineLen+1;
    }
    flushAll(); return blocks;
  }
  function readMinutes(body){
    const n = String(body||'').replace(/\s/g,'').length;
    return Math.max(1, Math.round(n/500));
  }
  return { parseMarkdown, readMinutes };
})();

/** 子路径部署：页面在 /wudao/admin/ 时 API 前缀为 /wudao */
const API = (function () {
  const p = location.pathname || ''
  if (p === '/wudao' || p.indexOf('/wudao/') === 0) return '/wudao'
  return ''
})()
let TOKEN = localStorage.getItem('wudao_admin_token') || ''

function toast(msg){
  const t = document.getElementById('toast')
  t.textContent = msg; t.style.display = 'block'
  setTimeout(() => t.style.display = 'none', 2200)
}
async function api(path, opts = {}){
  const res = await fetch(API + path, Object.assign({}, opts, {
    headers: Object.assign({'Content-Type':'application/json'}, TOKEN ? {Authorization: 'Bearer ' + TOKEN} : {})
  }))
  if (res.status === 401){ showLogin(); throw new Error('未登录') }
  const d = await res.json()
  if (d.code !== 0) throw new Error(d.msg || '请求失败')
  return d.data
}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
/** 相对 /uploads 在子路径部署下需加 API 前缀才能在后台预览 */
function mediaUrl(u){
  if (!u) return ''
  const s = String(u).trim()
  if (s.indexOf('http') === 0) return s
  if (s.indexOf('/uploads/') === 0 || s.indexOf('/images/') === 0) return API + s
  const name = s.replace(/\\/g, '/').split('/').pop()
  if (name && /\.(jpe?g|png|gif|webp|mp4|mov)$/i.test(name)) return API + '/uploads/' + name
  return s
}

const WEEKDAY_OPTS = [[1,'一'],[2,'二'],[3,'三'],[4,'四'],[5,'五'],[6,'六'],[7,'日']]
function parseWeekdaysAdmin(raw){
  if (Array.isArray(raw)) return [...new Set(raw.map(Number).filter(n => n>=1 && n<=7))].sort((a,b)=>a-b)
  const s = String(raw||'')
  if (/工作日/.test(s)) return [1,2,3,4,5]
  if (/周末/.test(s)) return [6,7]
  const found = []
  const re = /[周星]期?([一二三四五六日天])/g
  let m
  const map = {一:1,二:2,三:3,四:4,五:5,六:6,日:7,天:7}
  while ((m = re.exec(s))) if (map[m[1]]) found.push(map[m[1]])
  return [...new Set(found)].sort((a,b)=>a-b)
}
function formatWeekdaysAdmin(days){
  const list = parseWeekdaysAdmin(days)
  if (!list.length) return ''
  if (list.length === 7) return '每天'
  if (list.join(',') === '1,2,3,4,5') return '每周工作日'
  if (list.join(',') === '6,7') return '每周末'
  const names = {1:'一',2:'二',3:'三',4:'四',5:'五',6:'六',7:'日'}
  if (list.length === 1) return '每周' + names[list[0]]
  return '每周' + list.map(n => names[n]).join('、')
}
function inferDateModeAdmin(a){
  const mode = String((a&&a.dateMode)||'')
  if (mode === 'none' || mode === 'weekly' || mode === 'once') return mode
  const days = parseWeekdaysAdmin((a&&a.weekdays)||[])
  if (days.length) return 'weekly'
  if (parseWeekdaysAdmin((a&&a.dateText)||'').length) return 'weekly'
  if ((a&&a.startDate) || (a&&a.endDate)) return 'once'
  if (/月\s*\d{1,2}\s*日/.test(String((a&&a.dateText)||''))) return 'once'
  return 'none'
}
function weekdayBoxHtml(id, selected){
  const on = {}

}

/** 加粗转 HTML：先转义，再把 **x** 变 <b>x</b> */
function boldHtml(text){
  return esc(text).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
}

function renderPreview(){
  const body = document.getElementById('ed-body').value
  const blocks = PARSE_MD.parseMarkdown(body)
  const abs = u => mediaUrl(u)
  document.getElementById('ed-preview').innerHTML = blocks.map(b => {
    const pos = `data-start="${b._start}" data-end="${b._end}" onclick="locateInEditor(this)" title="点击定位到正文编辑处"`
    if (b.type==='h3') return `<div class="pv-h3" ${pos}>${boldHtml(b.text)}</div>`
    if (b.type==='h4') return `<div class="pv-h4" ${pos}>${boldHtml(b.text)}</div>`
    if (b.type==='ul' || b.type==='ol') {
      const items = (b.items||[]).map((it, i) => {
        const mk = b.type==='ol' ? ((it.n || (i+1)) + '.') : '•'
        return `<li><span class="mk">${mk}</span><span class="tx">${boldHtml(it.text)}</span></li>`
      }).join('')
      return `<ul class="pv-list" ${pos}>${items}</ul>`
    }
    if (b.type==='callout') return `<div class="pv-callout" ${pos}>${b.title?`<div class="co-title">${esc(b.title)}</div>`:''}<div class="co-body">${boldHtml(b.text)}</div></div>`
    if (b.type==='quote') return `<div class="pv-quote" ${pos}>${b.text?boldHtml(b.text):''}${b.cite?`<span class="cite">${esc(b.cite)}</span>`:''}</div>`
    if (b.type==='table') {
      const aligns = b.aligns || []
      let h = `<div ${pos} style="overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:8px"><table style="width:100%;border-collapse:collapse;font-size:13px;background:#fff">`
      h += '<thead><tr style="background:#eeedfe;color:#3c3489;font-weight:700">'
      ;(b.headers || []).forEach((th, i) => {
        const align = aligns[i] || 'left'
        h += `<th style="padding:8px 10px;border-bottom:2px solid #dcd8fc;text-align:${align};white-space:nowrap">${boldHtml(th.text)}</th>`
      })
      h += '</tr></thead><tbody>'
      ;(b.rows || []).forEach((row, rIdx) => {
        const bg = rIdx % 2 === 1 ? '#f9fafb' : '#fff'
        h += `<tr style="background:${bg}">`
        row.forEach((cell, cIdx) => {
          const align = aligns[cIdx] || 'left'
          h += `<td style="padding:7px 10px;border-bottom:1px solid #e5e7eb;border-right:1px solid #f0f0f0;text-align:${align}">${boldHtml(cell.text)}</td>`
        })
        h += '</tr>'
      })
      h += '</tbody></table></div>'
      return h
    }
    if (b.type==='img') return b.url
      ? `<img class="pv-img-real" ${pos} src="${esc(abs(b.url))}" loading="lazy" alt="${esc(b.text)}">`
      : `<div class="pv-img" ${pos}>🖼 ${esc(b.text)}</div>`
    if (b.type==='video') return b.url
      ? `<video class="pv-video" ${pos} src="${esc(abs(b.url))}" controls preload="metadata"></video>`
      : `<div class="pv-img" ${pos}>🎬 ${esc(b.text)}</div>`
    return `<div class="pv-p" ${pos}>${boldHtml(b.text)}</div>`
  }).join('') || '<span style="color:var(--muted2)">左侧输入正文，此处实时预览…</span>'
}

/** 点击预览块 → 正文框定位选中对应源码（联动编辑） */
function locateInEditor(el){
  const ta = document.getElementById('ed-body')
  const start = Number(el.dataset.start), end = Number(el.dataset.end)
  ta.focus()
  ta.setSelectionRange(start, end)
  // 近似滚动到可见：按行号估算
  const lineIdx = ta.value.slice(0, start).split('\n').length - 1
  const lineHeight = 24 // 与 textarea 行高一致
  ta.scrollTop = Math.max(0, lineIdx * lineHeight - ta.clientHeight / 2)
  // 短暂高亮提示
  el.style.outline = '2px solid var(--purple)'
  setTimeout(() => { el.style.outline = '' }, 600)
}

/** 光标处插入文本（返回插入终点） */
function insertAtCursor(text, selectStart, selectLen){
  const ta = document.getElementById('ed-body')
  const s = ta.selectionStart, e = ta.selectionEnd
  ta.value = ta.value.slice(0, s) + text + ta.value.slice(e)
  const selS = s + (selectStart == null ? 0 : selectStart)
  ta.focus()
  if (selectLen) ta.setSelectionRange(selS, selS + selectLen)
  else ta.setSelectionRange(s + text.length, s + text.length)
  renderPreview()
  return s + text.length
}

function insAround(prefix, placeholder){
  const ta = document.getElementById('ed-body')
  const s = ta.selectionStart, e = ta.selectionEnd
  const sel = ta.value.slice(s, e)
  const inner = sel || placeholder
  const suffix = (prefix === '**' || prefix === '*') ? prefix : ''
  ta.value = ta.value.slice(0, s) + prefix + inner + suffix + ta.value.slice(e)
  const selS = s + prefix.length
  ta.focus()
  ta.setSelectionRange(selS, selS + inner.length)
  renderPreview()
}

function insLink(){
  const url = prompt('链接地址：', 'https://')
  if (!url) return
  insertAtCursor(`[链接文字](${url})`, 1, 4)
}

/** Call-out：直接插入可编辑骨架（标题+正文高亮待改），无弹窗 */
function insertCallout(){
  insertAtCursor('>>t 导读\n>> 在此输入引言内容…\n\n', 10, 8) // 选中"导读"
}

function insertList(kind){
  if (kind === 'ol') insertAtCursor('1. 条目一\n2. 条目二\n\n', 3, 3)
  else insertAtCursor('- 条目一\n- 条目二\n\n', 2, 3)
}

/** Blockquote：直接插入可编辑骨架（引文+来源高亮待改），无弹窗 */
function insertQuote(){
  insertAtCursor('> 在此输入引用内容…\n> —— 来源（书名/作者）\n\n', 2, 9) // 选中引文占位
}

/** Table：插入 Markdown 表格骨架 */
function insertTable(){
  const sample = '| 鞋款 | 质量 | 价格 | 搭配度 | 舒适度 | 更适合谁 |\n| --- | ---: | ---: | ---: | ---: | --- |\n| Nike AF1 Dance | 8 | 6 | 8 | 9 | 想认真跳、又想兼顾日常 |\n| Nike Dunk | 8 | 5 | 9 | 8 | HipHop、转圈、日常穿 |\n\n'

async function uploadFile(file, kind){
  const fd = new FormData()
  fd.append('file', file)
  const res = await fetch(API + '/api/admin/upload/' + kind, {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + TOKEN },
    body: fd
  })
  const d = await res.json()
  if (d.code !== 0) throw new Error(d.msg || '上传失败')
  return d.data.url
}
async function onFilePicked(ev, kind){

    const md = kind === 'image'
      ? `![图片描述](${url})`

    insertAtCursor(md + '\n\n', 2, nameLen)
    toast(kind === 'image' ? '图片已插入正文' : '视频已插入正文')

/** HTML5 拖动排序：松开后按当前行顺序提交 ids */
function bindTableDrag(tableId, apiPath, onDone){
  const table = document.getElementById(tableId)
  if (!table) return
  let dragEl = null
  table.querySelectorAll('tr.drag-row').forEach(tr => {
    tr.addEventListener('dragstart', e => {
      if (e.target.closest && e.target.closest('a,button,input,.cb')) {
        e.preventDefault(); return
      }
      dragEl = tr
      tr.classList.add('dragging')
      e.dataTransfer.effectAllowed = 'move'
      try { e.dataTransfer.setData('text/plain', tr.dataset.id) } catch (_) {}
    })
    tr.addEventListener('dragend', () => {
      tr.classList.remove('dragging')
      table.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over'))
      dragEl = null
    })
    tr.addEventListener('dragover', e => {
      e.preventDefault()
      e.dataTransfer.dropEffect = 'move'
      if (!dragEl || dragEl === tr) return
      // 仅允许在可拖动行之间重排（置顶区）
      if (!tr.classList.contains('drag-row')) return
      const rect = tr.getBoundingClientRect()
      const before = e.clientY < rect.top + rect.height / 2
      table.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over'))
      tr.classList.add('drag-over')
      if (before) tr.parentNode.insertBefore(dragEl, tr)
      else tr.parentNode.insertBefore(dragEl, tr.nextSibling)
    })
    tr.addEventListener('drop', async e => {
      e.preventDefault()
      table.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over'))
      const ids = [...table.querySelectorAll('tr.drag-row')].map(r => r.dataset.id).filter(Boolean)
      try {
        await api(apiPath, { method: 'POST', body: JSON.stringify({ ids }) })
        toast('排序已保存')
        if (onDone) onDone()
      } catch (err) {
        toast(err.message || '排序失败')
        if (onDone) onDone()
      }
    })
  })
}

function formatDateLabelAdmin(dateStr){
  if (!dateStr) return ''
  const p = String(dateStr).split('-')
  if (p.length < 3) return dateStr
  return Number(p[1]) + '月' + Number(p[2]) + '日'
}
function composeDateTextAdmin(start, end){
  const a = formatDateLabelAdmin(start)
  const b = formatDateLabelAdmin(end)
  if (a && b) return a === b ? a : (a + ' - ' + b)
  return a || b || '时间待定'
}
function composeTimeTextAdmin(start, end){
  const s = normalizeTimeValue(start)
  const e = normalizeTimeValue(end)
  if (s && e) return s === e ? s : (s + ' - ' + e)
  return s || e || ''
}
function onBuddyStartChange(){
  const start = (document.getElementById('a-start') || {}).value || ''
  const endEl = document.getElementById('a-end')
  if (start && endEl && !endEl.value) endEl.value = start
  updateActPreview()
}
/** HH:MM / HH:MM:SS → HH:MM，供 type=time */
function normalizeTimeValue(t){
  const m = String(t || '').trim().match(/^(\d{1,2}):(\d{2})/)
  if (!m) return ''
  return String(m[1]).padStart(2, '0') + ':' + m[2]
}
/** 从「14:00 - 22:00」解析起止时刻 */
function parseTimeRange(text){
  const s = String(text || '').trim()
  const m = s.match(/(\d{1,2}:\d{2})(?:\s*[-–—~至到]\s*(\d{1,2}:\d{2}))?/)
  if (!m) return { start: '', end: '' }
  return { start: normalizeTimeValue(m[1]), end: normalizeTimeValue(m[2] || '') }
}
/** 从 YYYY-MM-DD 或「8月24日」解析 ISO 日期 */
function parseDateToISO(text){
  const s = String(text || '').trim()
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s
  const m = s.match(/(\d{1,2})月(\d{1,2})日/)
  if (!m) return ''
  const y = new Date().getFullYear()
  return y + '-' + String(m[1]).padStart(2, '0') + '-' + String(m[2]).padStart(2, '0')
}
/** 编辑回填：优先 startDate/endDate，否则从 dateText 解析 */
function resolveActivityDates(a){
  let start = String(a.startDate || '').slice(0, 10)
  let end = String(a.endDate || '').slice(0, 10)
  if (!/^\d{4}-\d{2}-\d{2}$/.test(start)) start = ''
  if (!/^\d{4}-\d{2}-\d{2}$/.test(end)) end = ''
  if (!start && !end) {
    const text = String(a.dateText || '')
    const parts = text.split(/\s*[-–—~至到]\s*/)
    start = parseDateToISO(parts[0] || '')
    end = parts.length > 1 ? parseDateToISO(parts[1] || '') : ''
  }
  return { start, end }
}

function updateActPreview(){
  if (!document.getElementById('a-type')) return
  const type = document.getElementById('a-type').value
  const sub = (document.getElementById('a-buddy-sub') || {}).value || 'practice'
  const badge = actBadgeLabel(type, sub)
  const grad = actGrad(type, sub)
  const cover = ((document.getElementById('a-cover') || {}).value || '').trim()
  const hero = document.getElementById('act-hero')
  const media = document.getElementById('act-cover-media')
  const img = document.getElementById('act-cover-img')
  const titleEl = document.getElementById('act-prev-title')
  const badgeRow = document.getElementById('act-prev-badge-row')
  if (cover) {
    if (media) { media.style.display = 'flex'; }
    if (img) img.src = mediaUrl(cover)
    if (hero) hero.style.display = 'none'
    if (titleEl) { titleEl.style.display = ''; titleEl.textContent = document.getElementById('a-title').value || '活动标题' }
    if (badgeRow) badgeRow.style.display = ''
  } else {
    if (media) media.style.display = 'none'
    if (hero) { hero.style.display = 'flex'; hero.style.background = grad }
    if (titleEl) titleEl.style.display = 'none'
    if (badgeRow) badgeRow.style.display = 'none'
  }
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v }
  let coverDate = ''
  let listTime = ''
  const dateMode = readDateMode('a')
  const times = composeTimeTextAdmin(
    (document.getElementById('a-time-start') || {}).value,
    (document.getElementById('a-time-end') || {}).value
  )
  if (dateMode === 'weekly') {
    coverDate = formatWeekdaysAdmin(readWeekdays('a-weekdays')) || '每周循环'
    listTime = [coverDate, times].filter(Boolean).join(' · ')
  } else if (dateMode === 'once') {
    coverDate = composeDateTextAdmin(
      (document.getElementById('a-date') || {}).value,
      (document.getElementById('a-date-end') || {}).value
    )
    if (coverDate === '时间待定') coverDate = ''
    listTime = times || coverDate
  } else {
    coverDate = times
    listTime = times
  }
  set('act-hero-badge', badge)
  set('act-body-badge', badge)
  set('act-hero-title', document.getElementById('a-title').value || '活动标题')
  set('act-hero-date', coverDate)
  set('act-prev-desc', document.getElementById('a-desc').value || '列表摘要（活动介绍）')
  set('act-prev-loc', document.getElementById('a-loc').value || '地点')
  set('act-prev-time', listTime)
}

async function saveActivity(action){
  const title = document.getElementById('a-title').value.trim()
  if (!title){ toast('活动标题必填'); return }
  const type = document.getElementById('a-type').value
  const isBuddy = type === 'buddy'
  const danceTypes = readDanceValue(isBuddy ? 'a-dance-buddy' : 'a-dance')
  const dateMode = readDateMode('a')
  const weekdays = dateMode === 'weekly' ? readWeekdays('a-weekdays') : []
  if (dateMode === 'weekly' && !weekdays.length) { toast('请选择每周几'); return }
  let startDate = ''
  let endDate = ''
  if (dateMode === 'once') {
    startDate = document.getElementById('a-date').value || ''
    endDate = document.getElementById('a-date-end').value || ''
  }
  const startTime = normalizeTimeValue((document.getElementById('a-time-start')||{}).value)
  const endTime = normalizeTimeValue((document.getElementById('a-time-end')||{}).value)
  const dateText = dateMode === 'weekly'
    ? formatWeekdaysAdmin(weekdays)
    : (dateMode === 'once' ? composeDateTextAdmin(startDate, endDate) : '')
  const timeText = composeTimeTextAdmin(startTime, endTime)
  const payload = {
    action,
    type,
    title,
    desc: document.getElementById('a-desc').value.trim(),
    notes: document.getElementById('a-notes').value.trim(),
    city: document.getElementById('a-city').value.trim() || '北京',
    location: document.getElementById('a-loc').value.trim(),
    danceTypes,
    organizer: isBuddy ? '舞岛官方' : (document.getElementById('a-org').value.trim() || '舞岛官方'),
    followCount: isBuddy || type === 'official' ? 0 : (parseInt(document.getElementById('a-follow').value, 10) || 0),
    headcount: isBuddy ? (document.getElementById('a-head').value.trim() || '不限') : '不限',
    buddySubType: isBuddy ? document.getElementById('a-buddy-sub').value : undefined,
    contestName: isBuddy ? (document.getElementById('a-contest')||{}).value || '' : '',
    coverUrl: document.getElementById('a-cover').value.trim(),
    dateMode,
    weekdays,
    startDate,
    endDate,
    startTime,
    endTime,
    dateText: dateText === '时间待定' ? '' : dateText,
    timeText,
    schedule: isBuddy ? [] : scheduleRows.map(r => ({
      time: normalizeTimeValue(r.time),
      item: r.item || ''
    })),
    pinned: document.getElementById('a-sw-pin').classList.contains('on')
  }
  const isNew = route() === 'activity-new'
  if (isNew) await api('/api/admin/activities', {method:'POST', body:JSON.stringify(payload)})
  else await api('/api/admin/activities/' + location.hash.split('id=')[1], {method:'PUT', body:JSON.stringify(payload)})
  toast(action === 'publish' ? '活动已发布！' : '已存草稿')
  location.hash = '#/activities'
}

          <div class="field"><label>结束日期</label><input type="date" id="br-end" value="${esc(r.endDate||r.startDate||'')}"></div>
        </div>
        </div>
        <div id="br-weekly-wrap" style="${inferDateModeAdmin(r)==='weekly'?'':'display:none'}">
          <div class="field"><label>每周几</label>${weekdayBoxHtml('br-weekdays', r.weekdays && r.weekdays.length ? r.weekdays : r.dateText)}</div>
        </div>
        <div class="dt-pair" style="margin-bottom:12px">
          <div class="field"><label>开始时刻</label><input type="time" id="br-start-time" value="${esc(r.startTime||'')}" step="900"></div>
          <div class="field"><label>结束时刻</label><input type="time" id="br-end-time" value="${esc(r.endTime||'')}" step="900"></div>
        </div>
        <div class="field"><label>地点</label><input type="text" id="br-loc" value="${esc(r.location||'')}"></div>
        <div class="field"><label>城市（后台归类）</label>${citySelectHtml('br-city', r.city || '北京')}</div>
        <div class="field"><label>舞种 · 可多选</label>${danceMultiHtml('br-dance', r.danceStyle || '')}</div>
        <div class="field"><label>人数（团购/找队友算「还差 N 人」）</label><input type="text" id="br-head" value="${esc(r.headcount||'不限')}"></div>
      </div>
      <div class="side-card">
        <h3>发布信息</h3>
        <div class="field"><label>发布账号</label><input type="text" value="舞岛官方" disabled></div>
        <div class="field"><label>发起人（查看加入用）</label><input type="text" value="${esc(r.contactWechat)}" disabled></div>
      </div>
    </div>
  </div>`
}

async function publishBuddy(id){
  const desc = document.getElementById('br-desc').value
  const notes = document.getElementById('br-notes').value
  const title = document.getElementById('br-title').value
  const sub = document.getElementById('br-sub').value
  const contestName = (document.getElementById('br-contest') || {}).value || ''
  if (sub === 'teammate' && !String(contestName).trim()) {
    toast('找队友请填写比赛名称'); return
  }
  if (/加微|加\s*v|微信[:：]|wechat/i.test(desc + notes + title)){
    toast('正文不能包含联系方式或「加微信」引流'); return
  }
  await api('/api/admin/buddy-requests/' + id + '/publish', {
    method:'POST',
    body: JSON.stringify({
      buddySubType: sub,
      title,
      desc, notes,
      contestName: sub === 'teammate' ? String(contestName).trim() : '',
      city: document.getElementById('br-city').value,
      location: document.getElementById('br-loc').value,
      dateMode: readDateMode('br'),
      weekdays: readDateMode('br') === 'weekly' ? readWeekdays('br-weekdays') : [],
      startDate: document.getElementById('br-start') ? document.getElementById('br-start').value : '',
      endDate: document.getElementById('br-end') ? document.getElementById('br-end').value : '',
      startTime: normalizeTimeValue((document.getElementById('br-start-time')||{}).value),
      endTime: normalizeTimeValue((document.getElementById('br-end-time')||{}).value),
      danceTypes: readDanceValue('br-dance'),
      headcount: document.getElementById('br-head').value
    })
  })
  toast('已发布为找搭子活动')
  location.hash = '#/buddy-requests'
}

function onBrStartChange(){
  const start = (document.getElementById('br-start') || {}).value || ''
  const endEl = document.getElementById('br-end')
  if (start && endEl && !endEl.value) endEl.value = start
}

function toggleBrContest(){
  const sub = document.getElementById('br-sub')
  const wrap = document.getElementById('br-contest-wrap')
  if (!sub || !wrap) return
  wrap.style.display = sub.value === 'teammate' ? '' : 'none'
}

/* ============ 启动 ============ */
(async function(){
  if (!TOKEN){ showLogin(); return }
  try{
    await api('/api/admin/stats')
    hideLogin(); render()
  }catch(e){ showLogin() }
})()
document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key==='Enter') doLogin() })
</script>
